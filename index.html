<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Ouvre dans le navigateur</title>
    <link rel="preload" as="image" href="bg.jpg" />

    <style>
      /* =========================================================
         DESIGN — mobile-first. Couleurs modifiables ici.
         ========================================================= */
      :root {
        --bg: #000000;
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.72);
        --accent: #ff4d7e;
        --accent-2: #ff8a5c;
        --ok: #38d996;
        --line: rgba(255, 255, 255, 0.16);
        --glass: rgba(14, 16, 22, 0.58);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
        line-height: 1.45;
        display: flex; flex-direction: column;
        min-height: 100vh; min-height: 100dvh;
        padding: 16px 14px calc(16px + env(safe-area-inset-bottom));
      }

      /* Photo plein écran + dégradé sombre en bas pour la lisibilité */
      /* Photo dans la moitié haute seulement, recadrée sur la personne
         (moins de ciel au-dessus de la tête), qui se fond dans le noir. */
      .bg {
        position: fixed; top: 0; left: 50%; z-index: 0;
        width: min(100vw, 520px); transform: translateX(-50%);
        height: 50vh; height: 50dvh;
        /* 120% = léger zoom sur la personne ; 30% = cadrage vertical (plus grand = moins de ciel) */
        background: var(--bg) url("bg.jpg") center 30% / 120% auto no-repeat;
      }
      .bg::after {
        content: ""; position: absolute; inset: 0;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0) 14%),
          linear-gradient(180deg, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.65) 82%, #000 100%);
      }

      /* Bulle animée qui pointe vers le menu ⋯ de l'appli (en haut à droite) */
      .pointer {
        position: fixed; top: 10px; right: 10px; z-index: 20;
        display: flex; align-items: center; gap: 6px;
        padding: 8px 12px 8px 14px; border-radius: 999px;
        background: #fff; color: #14161c;
        font-size: 14px; font-weight: 800;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
        animation: nudge 1.1s ease-in-out infinite;
      }
      .pointer .arrow { font-size: 17px; line-height: 1; color: var(--accent); }
      @keyframes nudge {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(3px, -5px); }
      }

      /* Carte en verre dépoli, collée en bas : le visage reste visible */
      .wrap {
        position: relative; z-index: 10;
        margin: auto auto 0; width: 100%; max-width: 440px;
      }
      .card {
        padding: 22px 18px 18px; border-radius: 26px; text-align: center;
        background: var(--glass); border: 1px solid var(--line);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        backdrop-filter: blur(18px) saturate(140%);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        animation: rise 0.5s ease-out both;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: none; }
      }

      .kicker {
        display: inline-block; margin: 0 0 10px; padding: 5px 12px; border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      }

      h1 {
        margin: 0 0 18px; font-size: 25px; line-height: 1.2; font-weight: 800;
        letter-spacing: -0.02em; text-wrap: balance;
      }
      h1 span {
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }

      /* Les 2 étapes numérotées */
      .steps { list-style: none; margin: 0; padding: 0; text-align: left; }
      .steps li {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; border-radius: 16px;
        background: rgba(255, 255, 255, 0.08);
        font-size: 16px; font-weight: 600; line-height: 1.35;
      }
      .steps li + li { margin-top: 8px; }
      .steps .n {
        flex: none; width: 28px; height: 28px; border-radius: 50%;
        display: grid; place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        font-size: 14px; font-weight: 800;
      }
      .steps .dots {
        display: inline-block; background: #fff; color: #14161c; border-radius: 8px;
        padding: 0 8px; font-weight: 900; letter-spacing: 2px; transform: translateY(-1px);
      }
      .steps b { font-weight: 800; }

      .or {
        display: flex; align-items: center; gap: 12px;
        margin: 16px 0 12px; color: var(--muted);
        font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      }
      .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

      /* Bouton « Copier le lien » — le seul bouton de la page */
      .copy {
        display: flex; align-items: center; justify-content: center; gap: 9px;
        width: 100%; min-height: 56px; padding: 14px 18px; border: 0;
        border-radius: 16px; font-size: 17px; font-weight: 800; color: #fff;
        text-decoration: none; cursor: pointer;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 10px 28px rgba(255, 77, 126, 0.4);
        transition: transform 0.1s ease;
      }
      .copy:active { transform: scale(0.98); }
      .copy.done {
        color: #0b1f16; background: linear-gradient(180deg, #5fe3a8, var(--ok));
        box-shadow: 0 10px 28px rgba(56, 217, 150, 0.35);
      }

      .hint {
        margin: 11px 0 0; color: var(--muted); font-size: 14px; line-height: 1.4;
        text-wrap: balance;
      }
      .hint b { color: #fff; font-weight: 700; }
      .hint.done { color: #fff; font-weight: 600; }

      .hidden { display: none !important; }

      /* Petits écrans (iPhone SE…) */
      @media (max-height: 640px) {
        .card { padding: 16px 14px 14px; }
        h1 { font-size: 21px; margin-bottom: 12px; }
        .steps li { padding: 9px 12px; font-size: 15px; }
        .or { margin: 11px 0 9px; }
        .copy { min-height: 50px; font-size: 16px; }
        .hint { font-size: 13px; margin-top: 8px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pointer, .card { animation: none; }
      }
    </style>
  </head>

  <body>
    <div class="bg" aria-hidden="true"></div>

    <!-- Bulle vers le menu ⋯ de l'appli (masquée dans un vrai navigateur) -->
    <div class="pointer hidden" id="pointer">
      <span>Appuie ici</span><span class="arrow">↗</span>
    </div>

    <div class="wrap">
      <!-- ÉTAT 1 : déjà dans un vrai navigateur → simple redirection -->
      <div id="view-redirect" class="card hidden">
        <h1>Redirection…</h1>
        <a class="copy" id="go-now" href="#">Continuer →</a>
      </div>

      <!-- ÉTAT 2 : dans une appli (Facebook, Insta…) → sortir -->
      <div id="view-escape" class="card hidden">
        <p class="kicker" id="kicker">Dernière étape avant d'en voir plus 🫣</p>
        <h1 id="title">Ouvre cette page dans <span>ton navigateur</span></h1>

        <ol class="steps">
          <li><span class="n">1</span><span id="step1">Appuie sur <span class="dots">⋯</span> en haut à droite</span></li>
          <li><span class="n">2</span><span id="step2">Choisis <b>« Ouvrir dans le navigateur »</b></span></li>
        </ol>

        <p class="or">ou</p>

        <a class="copy" id="copy" href="#" role="button">📋 Copier le lien</a>
        <p class="hint" id="hint" aria-live="polite">puis colle-le dans <b>Safari</b> ou <b>Chrome</b></p>
      </div>
    </div>

    <script>
      /* ===========================================================
         ⚙️ CONFIG — MODIFIE UNIQUEMENT CE BLOC
         =========================================================== */
      const CONFIG = {
        // 👉 L'adresse vers laquelle envoyer les gens.
        // /go trie par pays (France / autres) : les liens finaux sont dans le fichier _redirects.
        destination: "https://chloe-privee.fr/?v=5-2",

        // Textes (change-les librement) :
        kicker: "Dernière étape avant d'en voir plus 🫣",
        title:  'Ouvre cette page dans <span>ton navigateur</span>',
        step1:  'Appuie sur <span class="dots">⋯</span> en haut à droite',
        step2:  'Choisis <b>« Ouvrir dans le navigateur »</b>',

        copyLabel: "📋 Copier le lien",
        copyHint:  "puis colle-le dans <b>Safari</b> ou <b>Chrome</b>",
        copyDone:  "✅ Lien copié !",
        copyDoneHint: "Maintenant ouvre Safari ou Chrome et colle-le dans la barre d'adresse",
      };
      /* =========================================================== */


      /* ---------- Détection : est-on dans le navigateur d'une appli ? ---------- */
      const ua = navigator.userAgent || navigator.vendor || "";
      const isAndroid = /Android/i.test(ua);

      const apps = {
        TikTok:    /BytedanceWebview|musical_ly|trill|TikTok|Tiktok|ByteFull/i,
        Instagram: /Instagram/i,
        Facebook:  /FBAN|FBAV|FB_IAB|FBIOS/i,
        Messenger: /Messenger/i,
        Snapchat:  /Snapchat/i,
        Pinterest: /Pinterest/i,
        LinkedIn:  /LinkedInApp/i,
        Line:      /\bLine\//i,
        Twitter:   /Twitter/i,
      };
      let inApp = false;
      for (const name in apps) { if (apps[name].test(ua)) { inApp = true; break; } }
      if (isAndroid && /; wv\)|\bwv\b/i.test(ua)) inApp = true; // WebView Android générique

      // 🔧 Aperçu / forçage via l'URL : ?preview=app | browser
      const forced = new URLSearchParams(location.search).get("preview");
      if (forced === "app" || forced === "ios" || forced === "android") inApp = true;
      if (forced === "browser") inApp = false;


      /* ---------- Copier le lien ---------- */
      function copyLink(el) {
        const url = CONFIG.destination;
        const done = () => {
          el.textContent = CONFIG.copyDone; el.classList.add("done");
          const hint = document.getElementById("hint");
          hint.textContent = CONFIG.copyDoneHint; hint.classList.add("done");
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done).catch(fallback);
        } else { fallback(); }
        function fallback() {
          const t = document.createElement("textarea");
          t.value = url; t.style.position = "fixed"; t.style.opacity = "0";
          document.body.appendChild(t); t.select();
          try { document.execCommand("copy"); done(); } catch (e) {}
          document.body.removeChild(t);
        }
      }


      /* ---------- Affichage ---------- */
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("kicker").innerHTML = CONFIG.kicker;
        document.getElementById("title").innerHTML = CONFIG.title;
        document.getElementById("step1").innerHTML = CONFIG.step1;
        document.getElementById("step2").innerHTML = CONFIG.step2;
        document.getElementById("copy").textContent = CONFIG.copyLabel;
        document.getElementById("hint").innerHTML = CONFIG.copyHint;

        // Déjà dans un vrai navigateur → on redirige vers la destination.
        if (!inApp) {
          document.getElementById("view-redirect").classList.remove("hidden");
          document.getElementById("go-now").href = CONFIG.destination;
          setTimeout(() => { location.replace(CONFIG.destination); }, 300);
          return;
        }

        // Dans une appli → on affiche l'instruction + le copier-coller.
        document.getElementById("view-escape").classList.remove("hidden");
        document.getElementById("pointer").classList.remove("hidden");

        const copy = document.getElementById("copy");
        copy.addEventListener("click", (e) => { e.preventDefault(); copyLink(copy); });
      });
    </script>
  </body>
</html>
